<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tic Tac Toe</title>

<!-- PWA meta tags -->
<meta name="theme-color" content="#e94560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TicTacToe">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: #e94560;
  }

  #status {
    font-size: 1.25rem;
    margin-bottom: 1rem;
    min-height: 1.5em;
  }

  #board {
    display: grid;
    gap: 6px;
    width: min(85vw, 420px);
    height: min(85vw, 420px);
  }

  .cell {
    background: #16213e;
    border: 2px solid #0f3460;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    aspect-ratio: 1;
    line-height: 1;
  }

  .cell:active { background: #1a2a50; }

  .cell.x { color: #e94560; }
  .cell.o { color: #0fbcf9; }

  .cell.win {
    background: #0f3460;
    animation: pulse 0.6s ease-in-out 2;
  }

  @keyframes pulse {
    50% { transform: scale(1.08); }
  }

  #controls {
    margin-top: 1.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-size: 1rem;
    padding: 0.6rem 1.4rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.15s;
  }

  button:active { opacity: 0.7; }

  #resetBtn {
    background: #e94560;
    color: #fff;
  }

  #modeBtn, #sizeSelect {
    background: #0f3460;
    color: #eee;
  }

  #sizeSelect {
    font-size: 1rem;
    padding: 0.6rem 1rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }

  #score {
    margin-top: 1rem;
    font-size: 1.1rem;
    display: flex;
    gap: 2rem;
  }

  .score-x { color: #e94560; }
  .score-o { color: #0fbcf9; }
</style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="status">X's turn</div>
<div id="board"></div>
<div id="score">
  <span class="score-x">X: <span id="scoreX">0</span></span>
  <span>Draw: <span id="scoreD">0</span></span>
  <span class="score-o">O: <span id="scoreO">0</span></span>
</div>
<div id="controls">
  <button id="resetBtn">New Game</button>
  <button id="modeBtn">vs Computer</button>
  <select id="sizeSelect">
    <option value="3">3 × 3</option>
    <option value="4">4 × 4</option>
    <option value="5">5 × 5</option>
    <option value="7">7 × 7</option>
  </select>
</div>

<script>
// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

const board = document.getElementById('board');
const status = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const modeBtn = document.getElementById('modeBtn');
const sizeSelect = document.getElementById('sizeSelect');

let cells, state, turn, gameOver, vsAI, scores;
let size = 3, winLen = 3, lines = [];

function init() {
  scores = { X: 0, O: 0, D: 0 };
  vsAI = vsAI || false;
  applySize(parseInt(sizeSelect.value, 10));
}

function applySize(n) {
  size = n;
  winLen = n <= 4 ? n : 5;
  lines = buildLines(size, winLen);
  board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  const fontPx = Math.min(85 / size, 14);
  document.querySelectorAll('.cell').forEach(c => {});
  reset();
}

function buildLines(n, k) {
  const out = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      if (c + k <= n) out.push(Array.from({length: k}, (_, i) => r * n + c + i));
      if (r + k <= n) out.push(Array.from({length: k}, (_, i) => (r + i) * n + c));
      if (r + k <= n && c + k <= n) out.push(Array.from({length: k}, (_, i) => (r + i) * n + c + i));
      if (r + k <= n && c - k + 1 >= 0) out.push(Array.from({length: k}, (_, i) => (r + i) * n + c - i));
    }
  }
  return out;
}

function reset() {
  state = Array(size * size).fill('');
  turn = 'X';
  gameOver = false;
  status.textContent = turn + "'s turn  (" + winLen + " in a row)";
  render();
}

function render() {
  board.innerHTML = '';
  const fontVw = Math.floor(45 / size);
  const fontPx = Math.floor(320 / size);
  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (state[i] ? ' ' + state[i].toLowerCase() : '');
    cell.textContent = state[i];
    cell.style.fontSize = `min(${fontVw}vw, ${fontPx}px)`;
    cell.addEventListener('click', () => play(i));
    board.appendChild(cell);
  }
  cells = board.children;
  updateScore();
}

function play(i) {
  if (gameOver || state[i]) return;
  if (vsAI && turn === 'O') return;

  state[i] = turn;
  cells[i].textContent = turn;
  cells[i].classList.add(turn.toLowerCase());

  const win = checkWin(turn);
  if (win) return endGame(turn + ' wins!', win);
  if (state.every(c => c)) return endGame("It's a draw!", null);

  turn = turn === 'X' ? 'O' : 'X';
  status.textContent = turn + "'s turn";

  if (vsAI && turn === 'O') {
    setTimeout(aiMove, 300);
  }
}

function aiMove() {
  if (gameOver) return;
  const move = bestMove();
  if (move == null) return;
  state[move] = 'O';
  cells[move].textContent = 'O';
  cells[move].classList.add('o');

  const win = checkWin('O');
  if (win) return endGame('O wins!', win);
  if (state.every(c => c)) return endGame("It's a draw!", null);

  turn = 'X';
  status.textContent = "X's turn";
}

function bestMove() {
  const N = size * size;
  for (let i = 0; i < N; i++) {
    if (!state[i]) { state[i] = 'O'; if (checkWin('O')) { state[i] = ''; return i; } state[i] = ''; }
  }
  for (let i = 0; i < N; i++) {
    if (!state[i]) { state[i] = 'X'; if (checkWin('X')) { state[i] = ''; return i; } state[i] = ''; }
  }
  // Prefer cells adjacent to existing marks
  const empty = [];
  for (let i = 0; i < N; i++) if (!state[i]) empty.push(i);
  if (!empty.length) return null;
  const center = Math.floor(size / 2) * size + Math.floor(size / 2);
  if (!state[center]) return center;
  const adjacent = empty.filter(i => hasNeighbor(i));
  const pool = adjacent.length ? adjacent : empty;
  return pool[Math.floor(Math.random() * pool.length)];
}

function hasNeighbor(i) {
  const r = Math.floor(i / size), c = i % size;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < size && nc >= 0 && nc < size && state[nr * size + nc]) return true;
    }
  }
  return false;
}

function checkWin(p) {
  for (const line of lines) {
    if (line.every(i => state[i] === p)) return line;
  }
  return null;
}

function endGame(msg, winLine) {
  gameOver = true;
  status.textContent = msg;
  if (winLine) {
    winLine.forEach(i => cells[i].classList.add('win'));
    scores[turn]++;
  } else {
    scores.D++;
  }
  updateScore();
}

function updateScore() {
  document.getElementById('scoreX').textContent = scores.X;
  document.getElementById('scoreO').textContent = scores.O;
  document.getElementById('scoreD').textContent = scores.D;
}

resetBtn.addEventListener('click', reset);
modeBtn.addEventListener('click', () => {
  vsAI = !vsAI;
  modeBtn.textContent = vsAI ? 'vs Human' : 'vs Computer';
  scores = { X: 0, O: 0, D: 0 };
  reset();
});
sizeSelect.addEventListener('change', () => {
  scores = { X: 0, O: 0, D: 0 };
  applySize(parseInt(sizeSelect.value, 10));
});

init();
</script>
</body>
</html>
