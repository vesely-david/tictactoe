<html lang="cs">
<head>

<meta name="theme-color" content="#10162f">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Herní koutek">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--night:#10162f;--panel:#172044;--dan:#ff6f7d;--dan2:#a93956;--fil:#50bde8;--fil2:#2376a5;--gold:#ffd56a}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 10%,#8a453d33,transparent 28%),radial-gradient(circle at 90% 85%,#35579133,transparent 30%),var(--night);color:#f8f5ef;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}button,select{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100vh;min-height:100dvh;width:100%}.screen.active{display:flex}.icon-btn{width:52px;height:52px;border:1px solid #ffffff2b;border-radius:16px;background:#ffffff14;color:white;display:grid;place-items:center;font-size:1.55rem;box-shadow:inset 0 1px #ffffff1f}.icon-btn:active{transform:scale(.94)}
/* Home */
#homeScreen{align-items:center;justify-content:center;flex-direction:column;gap:clamp(28px,6vh,60px);padding:32px}.home-title{text-align:center}.home-title span{display:block;font-size:2.4rem;margin-bottom:8px}.home-title h1{font-size:clamp(2.1rem,6vw,4rem);letter-spacing:-.04em}.game-picker{width:min(900px,94vw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,4vw,36px)}.game-card{min-height:clamp(210px,34vw,310px);border:1px solid #ffffff26;border-radius:32px;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;box-shadow:0 22px 60px #00000040,inset 0 1px #ffffff26;transition:.18s}.game-card:active{transform:scale(.97)}.tic-card{background:linear-gradient(145deg,#5b244d,#20335e)}.routine-card{background:linear-gradient(145deg,#a7504f,#1b6d74 68%,#1d3d55)}.game-icon{font-size:clamp(4.4rem,11vw,7rem);line-height:1;filter:drop-shadow(0 10px 16px #0004)}.xo{display:flex;font-weight:900}.xo .x{color:#ff6c83}.xo .o{color:#50c9f5}.game-name{font-size:clamp(1.15rem,3vw,1.65rem);font-weight:750}
/* Headers */
.game-header{width:min(1160px,97vw);min-height:72px;display:grid;grid-template-columns:64px 1fr 128px;align-items:center;margin:5px auto 0;padding:5px 12px;position:relative;z-index:5}.game-header h1{text-align:center;font-size:clamp(1.55rem,4vw,2.35rem);letter-spacing:-.035em}.header-actions{display:flex;justify-content:flex-end;gap:9px}
/* Tic Tac Toe */
#ticScreen{flex-direction:column;align-items:center}#ticScreen h1{color:#e94560}.tic-wrap{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 22px}#status{font-size:1.25rem;margin-bottom:1rem;min-height:1.5em}#board{display:grid;gap:6px;width:min(67vh,78vw,420px);height:min(67vh,78vw,420px)}.cell{background:#16213e;border:2px solid #0f3460;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;transition:background .15s;aspect-ratio:1;line-height:1}.cell:active{background:#1a2a50}.cell.x{color:#e94560}.cell.o{color:#0fbcf9}.cell.win{background:#0f3460;animation:pulse .6s ease-in-out 2}@keyframes pulse{50%{transform:scale(1.08)}}#controls{margin-top:1.2rem;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}#controls button,#sizeSelect{font-size:1rem;padding:.6rem 1.2rem;border:0;border-radius:8px;font-weight:600}#resetBtn{background:#e94560;color:white}#modeBtn,#sizeSelect{background:#0f3460;color:#eee}#score{margin-top:.8rem;font-size:1.1rem;display:flex;gap:2rem}.score-x{color:#e94560}.score-o{color:#0fbcf9}
/* Evening challenge */
#routineScreen{flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(circle at 7% 56%,#ffa65933,transparent 28%),radial-gradient(circle at 92% 46%,#5d74d726,transparent 28%)}#routineScreen:before{content:"";position:absolute;inset:auto 0 0;height:22%;background:linear-gradient(to top,#052223bb,transparent)}#routineScreen h1{color:#fff1cb}.routine-wrap{width:min(1180px,98vw);margin:auto;padding:6px 20px 30px;position:relative;z-index:2}.timeline-card{border:1px solid #ffffff29;border-radius:32px;padding:clamp(18px,3vw,34px);background:linear-gradient(120deg,#4f2830c7,#132347eb 50%,#102c45e8);box-shadow:0 26px 80px #0005,inset 0 1px #ffffff1a;overflow:hidden}.timeline-grid{display:grid;grid-template-columns:clamp(76px,11vw,126px) minmax(500px,1fr) clamp(60px,8vw,90px);gap:14px clamp(8px,1.6vw,20px);align-items:center}.edge{display:grid;place-items:center;font-size:clamp(2.5rem,6vw,4.5rem);filter:drop-shadow(0 8px 10px #0005)}.dinner{grid-column:1}.sleep{grid-column:3}.time-arrow{grid-column:2;height:14px;position:relative;background:linear-gradient(90deg,#ffb066,#7b8fc8 64%,#ccd9ff);border-radius:99px;box-shadow:0 0 22px #ffd56a40}.time-arrow:after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);border-left:18px solid #ccd9ff;border-top:13px solid transparent;border-bottom:13px solid transparent}.kid-label{display:flex;align-items:center;gap:7px;min-width:0}.avatar{width:clamp(50px,7vw,70px);height:clamp(50px,7vw,70px);border-radius:50%;display:grid;place-items:center;font-size:clamp(2rem,4.5vw,3.1rem);box-shadow:0 8px 20px #0004,inset 0 2px #ffffff40;flex:none}.dan-label .avatar{background:linear-gradient(145deg,#ff9f98,var(--dan2))}.fil-label .avatar{background:linear-gradient(145deg,#86dcf2,var(--fil2))}.narnia-label .avatar{background:linear-gradient(145deg,#ffd978,#987330)}.kid-name{font-weight:750;font-size:clamp(.72rem,1.7vw,1.05rem);overflow:hidden;text-overflow:ellipsis}.lane{height:clamp(72px,10vw,104px);position:relative;border-radius:22px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),#ffffff0a calc(10% - 1px),#ffffff0a 10%),#070c216b;border:1px solid #ffffff1f;box-shadow:inset 0 10px 24px #0002;touch-action:none}.lane:before{content:"";position:absolute;left:0;top:10%;bottom:10%;width:3px;border-radius:3px}.lane[data-kid=danielka]:before{background:var(--dan)}.lane[data-kid=filipek]:before{background:var(--fil)}.activity{position:absolute;top:13%;height:74%;border:0;border-radius:16px;color:white;display:flex;align-items:center;justify-content:center;gap:clamp(2px,.5vw,7px);cursor:grab;touch-action:none;transition:left .42s cubic-bezier(.2,.85,.22,1),transform .16s,box-shadow .16s;box-shadow:0 8px 16px #0004,inset 0 1px #ffffff4d;overflow:hidden;z-index:2}.activity[data-kid=danielka]{background:linear-gradient(145deg,var(--dan),var(--dan2))}.activity[data-kid=filipek]{background:linear-gradient(145deg,var(--fil),var(--fil2))}.activity.reading{border:3px solid #ffde828c}.activity.dragging{cursor:grabbing;transform:translateY(-8px) scale(1.04);box-shadow:0 18px 28px #0006;transition:transform .1s;z-index:20}.task-icon{font-size:clamp(1.6rem,4vw,3rem);line-height:1;pointer-events:none}.reading .task-icon{font-size:clamp(1.15rem,2.6vw,2rem)}.dad-icon{border-radius:50%}.dad-flash .dad-icon{animation:dadFlash .65s ease 2}@keyframes dadFlash{50%{transform:scale(1.45);filter:drop-shadow(0 0 10px #ffe17f)}}.reward-track{height:clamp(76px,10vw,108px);position:relative;border-radius:24px;overflow:hidden;background:#05131e85;border:1px solid #ffffff1f}.reward-track:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(20% - 1px),#ffffff0d calc(20% - 1px),#ffffff0d 20%);z-index:3;pointer-events:none}.reward-fill{position:absolute;top:0;bottom:0;overflow:hidden;background:linear-gradient(to top,#144a34fa,#428b5ed1 55%,#96c27d57);box-shadow:-8px 0 26px #ffd56a38,inset 3px 0 #ffde808c;transition:left .52s cubic-bezier(.2,.85,.22,1),width .52s cubic-bezier(.2,.85,.22,1)}.reward-fill:before{content:"🌲  🌳  🌲  🌳  🌲  🌳  🌲";position:absolute;left:8px;bottom:-7px;font-size:clamp(1.6rem,3.7vw,3.1rem);white-space:nowrap;opacity:.82}.chapters{position:absolute;inset:0;z-index:4;pointer-events:none}.chapter{position:absolute;top:12%;height:76%;width:20%;display:grid;place-items:center;font-size:clamp(1.8rem,4vw,3.3rem);filter:drop-shadow(0 6px 7px #0006);animation:chapterIn .48s cubic-bezier(.18,.9,.32,1.35) both}@keyframes chapterIn{from{opacity:0;transform:scale(.3) rotate(-12deg)}}.celebration{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:10}.confetti{position:absolute;top:-24px;width:12px;height:18px;border-radius:4px;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translate3d(var(--drift),115vh,0) rotate(740deg);opacity:.2}}.lion{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(6rem,18vw,12rem);filter:drop-shadow(0 0 34px #ffd765b3);animation:lionPop 1.4s cubic-bezier(.18,.85,.25,1) forwards}@keyframes lionPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}25%,70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}.portrait-hint{display:none}
@media(orientation:portrait) and (max-width:820px){.portrait-hint{display:grid;place-items:center;position:fixed;inset:0;z-index:100;background:#090e22f5;font-size:5rem}}@media(max-width:720px){.game-picker{grid-template-columns:1fr}.game-card{min-height:210px}.game-header{grid-template-columns:56px 1fr 112px}.routine-wrap{overflow-x:auto}.timeline-card{min-width:720px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<main id="homeScreen" class="screen active" aria-label="Výběr hry">
  <div class="home-title"><span aria-hidden="true">✨</span><h1>Herní koutek</h1></div>
  <div class="game-picker">
    <button class="game-card tic-card" data-open="ticScreen"><span class="game-icon xo" aria-hidden="true"><span class="x">X</span><span class="o">O</span></span><span class="game-name">Tic Tac Toe</span></button>
    <button class="game-card routine-card" data-open="routineScreen"><span class="game-icon" aria-hidden="true">🍽️ → 🌙</span><span class="game-name">Večerní výzva</span></button>
  </div>
</main>

<section id="ticScreen" class="screen" aria-label="Tic Tac Toe">
  <header class="game-header"><button class="icon-btn home-btn" aria-label="Home">⌂</button><h1>Tic Tac Toe</h1><div></div></header>
  <div class="tic-wrap">
    <div id="status">X's turn</div><div id="board"></div>
    <div id="score"><span class="score-x">X: <span id="scoreX">0</span></span><span>Draw: <span id="scoreD">0</span></span><span class="score-o">O: <span id="scoreO">0</span></span></div>
    <div id="controls"><button id="resetBtn">New Game</button><button id="modeBtn">vs Computer</button><select id="sizeSelect" aria-label="Board size"><option value="3">3 × 3</option><option value="4">4 × 4</option><option value="5">5 × 5</option><option value="7">7 × 7</option></select></div>
  </div>
</section>

<section id="routineScreen" class="screen" aria-label="Večerní výzva">
  <header class="game-header"><button class="icon-btn home-btn" aria-label="Domů">⌂</button><h1>Večerní výzva</h1><div class="header-actions"><button id="soundBtn" class="icon-btn" aria-label="Vypnout zvuk">🔊</button><button id="routineResetBtn" class="icon-btn" aria-label="Začít znovu">↻</button></div></header>
  <div class="routine-wrap"><div class="timeline-card"><div class="timeline-grid">
    <div class="edge dinner" aria-hidden="true">🍽️</div><div class="time-arrow" aria-hidden="true"></div><div class="edge sleep" aria-hidden="true">🌙</div>
    <div class="kid-label dan-label"><div class="avatar" aria-hidden="true">👧</div><span class="kid-name">Danielka</span></div><div class="lane" data-kid="danielka"></div><div class="edge" aria-hidden="true">🛏️</div>
    <div class="kid-label fil-label"><div class="avatar" aria-hidden="true">👦</div><span class="kid-name">Filipek</span></div><div class="lane" data-kid="filipek"></div><div></div>
    <div class="kid-label narnia-label"><div class="avatar" aria-hidden="true">🦁</div><span class="kid-name">Narnie</span></div><div class="reward-track"><div id="rewardFill" class="reward-fill"></div><div id="chapterLayer" class="chapters"></div></div><div class="edge" aria-hidden="true">📖</div>
  </div></div></div>
  <div id="celebration" class="celebration" aria-hidden="true"></div><div class="portrait-hint" aria-label="Otoč tablet na šířku">↻ 📱</div>
</section>

<script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>r.update());
const screens=document.querySelectorAll('.screen');
function showScreen(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));if(id==='routineScreen')requestAnimationFrame(renderRoutine)}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.open)));
document.querySelectorAll('.home-btn').forEach(b=>b.addEventListener('click',()=>showScreen('homeScreen')));

// Tic Tac Toe (original functionality)
const board=document.getElementById('board'),status=document.getElementById('status'),resetBtn=document.getElementById('resetBtn'),modeBtn=document.getElementById('modeBtn'),sizeSelect=document.getElementById('sizeSelect'),scoreX=document.getElementById('scoreX'),scoreO=document.getElementById('scoreO'),scoreD=document.getElementById('scoreD');let cells,state,turn,gameOver,vsAI,scores,size=3,winLen=3,lines=[];
function initTic(){scores={X:0,O:0,D:0};vsAI=vsAI||false;applySize(+sizeSelect.value)}
function applySize(n){size=n;winLen=n<=4?n:5;lines=buildLines(size,winLen);board.style.gridTemplateColumns=`repeat(${size},1fr)`;resetTic()}
function buildLines(n,k){const out=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){if(c+k<=n)out.push(Array.from({length:k},(_,i)=>r*n+c+i));if(r+k<=n)out.push(Array.from({length:k},(_,i)=>(r+i)*n+c));if(r+k<=n&&c+k<=n)out.push(Array.from({length:k},(_,i)=>(r+i)*n+c+i));if(r+k<=n&&c-k+1>=0)out.push(Array.from({length:k},(_,i)=>(r+i)*n+c-i))}return out}
function resetTic(){state=Array(size*size).fill('');turn='X';gameOver=false;status.textContent=`${turn}'s turn  (${winLen} in a row)`;renderTic()}
function renderTic(){board.innerHTML='';const vw=Math.floor(45/size),px=Math.floor(320/size);for(let i=0;i<size*size;i++){const c=document.createElement('div');c.className='cell'+(state[i]?' '+state[i].toLowerCase():'');c.textContent=state[i];c.style.fontSize=`min(${vw}vw,${px}px)`;c.addEventListener('click',()=>play(i));board.appendChild(c)}cells=board.children;updateScore()}
function play(i){if(gameOver||state[i]||(vsAI&&turn==='O'))return;state[i]=turn;cells[i].textContent=turn;cells[i].classList.add(turn.toLowerCase());const win=checkWin(turn);if(win)return endGame(`${turn} wins!`,win);if(state.every(Boolean))return endGame("It's a draw!",null);turn=turn==='X'?'O':'X';status.textContent=`${turn}'s turn`;if(vsAI&&turn==='O')setTimeout(aiMove,300)}
function aiMove(){if(gameOver)return;const move=bestMove();if(move==null)return;state[move]='O';cells[move].textContent='O';cells[move].classList.add('o');const win=checkWin('O');if(win)return endGame('O wins!',win);if(state.every(Boolean))return endGame("It's a draw!",null);turn='X';status.textContent="X's turn"}
function bestMove(){const N=size*size;for(let i=0;i<N;i++)if(!state[i]){state[i]='O';if(checkWin('O')){state[i]='';return i}state[i]=''}for(let i=0;i<N;i++)if(!state[i]){state[i]='X';if(checkWin('X')){state[i]='';return i}state[i]=''}const empty=[];for(let i=0;i<N;i++)if(!state[i])empty.push(i);if(!empty.length)return null;const center=Math.floor(size/2)*size+Math.floor(size/2);if(!state[center])return center;const adjacent=empty.filter(hasNeighbor),pool=adjacent.length?adjacent:empty;return pool[Math.floor(Math.random()*pool.length)]}
function hasNeighbor(i){const r=Math.floor(i/size),c=i%size;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<size&&nc>=0&&nc<size&&state[nr*size+nc])return true}return false}
function checkWin(p){for(const line of lines)if(line.every(i=>state[i]===p))return line;return null}
function endGame(msg,win){gameOver=true;status.textContent=msg;if(win){win.forEach(i=>cells[i].classList.add('win'));scores[turn]++}else scores.D++;updateScore()}
function updateScore(){scoreX.textContent=scores.X;scoreO.textContent=scores.O;scoreD.textContent=scores.D}
resetBtn.addEventListener('click',resetTic);modeBtn.addEventListener('click',()=>{vsAI=!vsAI;modeBtn.textContent=vsAI?'vs Human':'vs Computer';scores={X:0,O:0,D:0};resetTic()});sizeSelect.addEventListener('change',()=>{scores={X:0,O:0,D:0};applySize(+sizeSelect.value)});

// Evening challenge: ten invisible half-block slots = five abstract long blocks.
const TOTAL=10,tasks=[
{id:'d-read',kid:'danielka',type:'reading',length:2,position:0,desired:0,kidIcon:'👧',label:'Danielka čte tátovi'},
{id:'d-teeth',kid:'danielka',type:'teeth',length:1,position:2,desired:2,icon:'🪥',label:'Danielka si čistí zuby'},
{id:'d-clothes',kid:'danielka',type:'clothes',length:1,position:3,desired:3,icon:'👕',label:'Danielka připravuje oblečení'},
{id:'f-read',kid:'filipek',type:'reading',length:2,position:4,desired:4,kidIcon:'👦',label:'Filipek čte tátovi'},
{id:'f-teeth',kid:'filipek',type:'teeth',length:1,position:6,desired:6,icon:'🪥',label:'Filipek si čistí zuby'},
{id:'f-clothes',kid:'filipek',type:'clothes',length:1,position:7,desired:7,icon:'👕',label:'Filipek připravuje oblečení'}];
const initial=tasks.map(t=>({id:t.id,position:t.position})),rewardFill=document.getElementById('rewardFill'),chapterLayer=document.getElementById('chapterLayer'),celebration=document.getElementById('celebration'),soundBtn=document.getElementById('soundBtn');let previousChapters=1,soundOn=true,audioContext,drag=null;
function taskElement(t){const b=document.createElement('button');b.className='activity '+(t.type==='reading'?'reading':'');b.dataset.taskId=t.id;b.dataset.kid=t.kid;b.setAttribute('aria-label',t.label);b.innerHTML=t.type==='reading'?`<span class="task-icon">${t.kidIcon}</span><span class="task-icon">📖</span><span class="task-icon dad-icon">👨</span>`:`<span class="task-icon">${t.icon}</span>`;b.addEventListener('pointerdown',startDrag);return b}
function buildRoutine(){document.querySelectorAll('.lane').forEach(l=>l.innerHTML='');tasks.forEach(t=>document.querySelector(`.lane[data-kid="${t.kid}"]`).appendChild(taskElement(t)));renderRoutine()}
function renderRoutine(){tasks.forEach(t=>{const e=document.querySelector(`[data-task-id="${t.id}"]`);if(!e||e.classList.contains('dragging'))return;e.style.left=`${t.position*10}%`;e.style.width=`calc(${t.length*10}% - 4px)`});const end=Math.max(...tasks.map(t=>t.position+t.length)),free=Math.max(0,TOTAL-end),chapters=Math.floor(free/2);rewardFill.style.left=`${end*10}%`;rewardFill.style.width=`${free*10}%`;renderChapters(end,chapters);if(chapters===3&&previousChapters<3)celebrate();else if(chapters>previousChapters)chapterSound();previousChapters=chapters}
function renderChapters(start,count){chapterLayer.innerHTML='';for(let i=0;i<count;i++){const c=document.createElement('span');c.className='chapter';c.textContent='📖';c.style.left=`${(start+i*2)*10}%`;c.style.animationDelay=`${i*90}ms`;chapterLayer.appendChild(c)}chapterLayer.setAttribute('aria-label',`${count} kapitoly Narnie`)}
function startDrag(e){if(e.button!==undefined&&e.button!==0)return;const el=e.currentTarget,t=tasks.find(x=>x.id===el.dataset.taskId),rect=el.parentElement.getBoundingClientRect(),own=el.getBoundingClientRect();drag={task:t,el,rect,grab:e.clientX-own.left};el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag);el.addEventListener('pointercancel',cancelDrag);tone(330,.035,.04);e.preventDefault()}
function moveDrag(e){if(!drag)return;const{task,el,rect,grab}=drag,max=rect.width*(1-task.length/TOTAL),left=Math.max(0,Math.min(max,e.clientX-rect.left-grab));el.style.left=`${left}px`}
function endDrag(e){if(!drag)return;const{task,el,rect,grab}=drag,target=Math.max(0,Math.min(TOTAL-task.length,Math.round((e.clientX-rect.left-grab)/rect.width*TOTAL))),before=new Map(tasks.map(t=>[t.id,t.position]));finishListeners(el);el.classList.remove('dragging');task.desired=target;arrange(task.id);const pushed=tasks.some(t=>t.id!==task.id&&before.get(t.id)!==t.position);if(pushed){pushSound();if(task.type==='reading'||tasks.some(t=>t.type==='reading'&&before.get(t.id)!==t.position))flashDad()}else tone(440,.055,.05);drag=null;renderRoutine()}
function cancelDrag(){if(!drag)return;finishListeners(drag.el);drag.el.classList.remove('dragging');drag=null;renderRoutine()}
function finishListeners(el){el.removeEventListener('pointermove',moveDrag);el.removeEventListener('pointerup',endDrag);el.removeEventListener('pointercancel',cancelDrag)}
// Preserve each child's chosen order, then pack everything at the earliest legal position.
function arrange(moved){const order={};['danielka','filipek'].forEach(k=>order[k]=tasks.filter(t=>t.kid===k).sort((a,b)=>a.desired-b.desired||(a.id===moved?-1:b.id===moved?1:a.position-b.position)));const cursor={danielka:0,filipek:0},free={danielka:0,filipek:0};let dadFree=0;while(cursor.danielka<3||cursor.filipek<3){const possible=['danielka','filipek'].filter(k=>cursor[k]<3).map(k=>order[k][cursor[k]]).sort((a,b)=>a.desired-b.desired||(a.id===moved?-1:b.id===moved?1:a.kid.localeCompare(b.kid))),t=possible[0];let start=free[t.kid];if(t.type==='reading')start=Math.max(start,dadFree);t.position=start;free[t.kid]=start+t.length;if(t.type==='reading')dadFree=start+t.length;cursor[t.kid]++}tasks.forEach(t=>t.desired=t.position)}
function flashDad(){document.querySelectorAll('.reading').forEach(e=>{e.classList.remove('dad-flash');void e.offsetWidth;e.classList.add('dad-flash');setTimeout(()=>e.classList.remove('dad-flash'),1400)})}
function resetRoutine(){initial.forEach(x=>{const t=tasks.find(y=>y.id===x.id);t.position=t.desired=x.position});previousChapters=1;celebration.innerHTML='';tone(300,.06,.08);renderRoutine()}
function celebrate(){successSound();celebration.innerHTML='<div class="lion">🦁</div>';const colors=['#ffd56a','#ff7183','#5ac4ea','#75c486','#f7a65c'];for(let i=0;i<30;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=`${3+Math.random()*94}%`;bit.style.background=colors[i%colors.length];bit.style.setProperty('--drift',`${-90+Math.random()*180}px`);bit.style.animationDelay=`${Math.random()*380}ms`;celebration.appendChild(bit)}setTimeout(()=>celebration.innerHTML='',2600)}
function audio(){if(!soundOn)return null;if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();return audioContext}
function tone(freq,duration=.06,volume=.06,delay=0){const ctx=audio();if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.setValueAtTime(.001,ctx.currentTime+delay);gain.gain.linearRampToValueAtTime(volume,ctx.currentTime+delay+.01);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+duration);osc.connect(gain).connect(ctx.destination);osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+duration+.02)}
function pushSound(){tone(210,.08,.055);tone(170,.1,.04,.055)}function chapterSound(){tone(520,.1,.04);tone(660,.13,.045,.08)}function successSound(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,.055,i*.11))}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.setAttribute('aria-label',soundOn?'Vypnout zvuk':'Zapnout zvuk');if(soundOn)tone(520,.08,.05)});document.getElementById('routineResetBtn').addEventListener('click',resetRoutine);window.addEventListener('resize',renderRoutine);
initTic();buildRoutine();
</script>
